name: CounterSignal Product V2

on:
  push:
    branches:
      - agent/countersignal-product-v2
    paths:
      - 'apps/python/countersignal/**'
      - '.github/workflows/countersignal-product-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/python/countersignal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/python/countersignal/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'calle-ai==0.2.0' 'pytest>=9.0.0'

      - name: Run CounterSignal tests
        run: python -m pytest -q

      - name: Verify judge-visible invariants
        run: python verify_product_v2.py

      - name: Reproduce contradiction benchmark
        run: python benchmark.py --json
